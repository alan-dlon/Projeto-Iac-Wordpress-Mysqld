---
- hosts: all
  handlers:
    - name: restart apache
      service:
        name: apache2
        state: restarted
  become: true  
  tasks:
    - name: Install Apache
      ansible.builtin.apt:
        name: apache2
        state: latest
        update_cache: yes

    - name: Install a list of packages
      ansible.builtin.apt:
        pkg:
          - apache2
          - ghostscript
          - libapache2-mod-php
          - mysql-server
          - php
          - php-bcmath
          - php-curl
          - php-imagick
          - php-intl
          - php-json
          - php-mbstring
          - php-mysql
          - php-xml
          - php-zip
          - python3-pymysql
        state: latest
        update_cache: yes

    - name: Create a directory if it does not exist
      ansible.builtin.file:
        path: /srv/www
        state: directory
        owner: www-data
        group: www-data
      become: yes

    - name: Unarchive a file that needs to be downloaded (added in 2.0)
      ansible.builtin.unarchive:
        src: https://wordpress.org/latest.tar.gz
        dest: /srv/www
        remote_src: yes
      become: yes
    - name: Copy file with owner and permissions
      ansible.builtin.copy:
        src: files/wordpress.conf
        dest: /etc/apache2/sites-available/000-default.conf
      become: yes
      notify:
        - restart apache
    - name: Create a new database with name 'wordpress_db'
      community.mysql.mysql_db:
        name: wordpress_db
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      become: yes
    - name: Criar usuario do banco de dados com nome 'wordpress_user' e senha '12345' com todos os privilegios de banco de dados
      ansible.builtin.command:
        cmd: mysql -e "CREATE USER IF NOT EXISTS 'wordpress_user'@'localhost' IDENTIFIED BY '12345'; GRANT ALL PRIVILEGES ON wordpress_db.* TO 'wordpress_user'@'localhost'; FLUSH PRIVILEGES;"
    - name: Garantir que o Apache esta a rodar com as configuracoes atualizadas
      ansible.builtin.service:
        name: apache2
        state: restarted
   