---
- hosts: all
  become: true  
  tasks:
    - name: Install Apache
      ansible.builtin.apt:
        name: apache2
        state: latest
        update_cache: yes

    - name: Install a list of packages
      ansible.builtin.apt:
        pkg:
          - apache2
          - ghostscript
          - libapache2-mod-php
          - mysql-server
          - php
          - php-bcmath
          - php-curl
          - php-imagick
          - php-intl
          - php-json
          - php-mbstring
          - php-mysql
          - php-xml
          - php-zip
        state: latest
        update_cache: yes

